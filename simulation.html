<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de simulation</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      margin-bottom: 20px;
      color: #555;
    }
    label {
      display: block;
      margin-top: 15px;
  font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .radio-group label {
      font-weight: normal;
    }
    button {
      width: 100%;
      margin-top: 25px;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>SIMU</h2>
<form id="simuForm">
  <label>Nom complet</label>
  <input type="text" name="nom" required>

  <label>Email</label>
  <input type="email" name="email" required>

  <label>Statut juridique</label>
  <select name="statut" required>
    <option value="physique">Personne physique</option>
    <option value="morale">Personne morale</option>
  </select>

  <label>Nature de la marchandise</label>
 <select name="nature" required>
    <option value="5">Chaussures</option>
    <option value="10">Vetements</option>
    <option value="20">Produits Cosmetiques</option>
    <option value="30">Produits Pharmaceutiques</option>
    <option value="5">Cigarettes</option>
    <option value="10">Boissons Alcoolisees</option>
    <option value="20">Boissons Non Alcoolisees</option>
    <option value="30">Animaux Vivants</option>
    <option value="10">Montres</option>
    <option value="20"> Telephones portables</option>
    <option value="30">luminaires</option>
    <option value="10">mobilier en bois</option>
    <option value="20">Produits surgeles</option>
     <option value="20">Vehicles Neuf</option>
    <option value="20">Vehicules d'occasion</option>

  </select>

  <label>Espèce tarifaire</label>
  <select name="tarif" required>
    <option value="5">Bien de 1ère nécessité (5%)</option>
    <option value="10">Matière première (10%)</option>
    <option value="20">Bien intermédiaire (20%)</option>
    <option value="30">Bien de consommation (30%)</option>
  </select>

  <label>Valeur en douane (FCFA)</label>
  <input type="number" name="vd" required>

  <button type="button" onclick="showPaymentForm()">Continuer vers le paiement</button>
</form>
</div>
<script src="JS/form.js"></script>
</body>
</html>

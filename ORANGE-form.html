        <title>payment-form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <body class="bg-white">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Paiement Mobile</h3></div>
                                    <div class="card-body">
                                        <form id="payment-form">
                                            <div class="mb-3">
                                                <label for="phone"
                                                class="form-label"> Numero de telephone</label>
                                                <input type="tel" class="form-control" id="phone" placeholder="6-- --- ---" required>
                                           </div>
                                            <div class=" mb-3">
                                                <label for="amount"
                                                class="form-label">Montant (FCFA)</label>
                                                <input type="number" class="form-control" id="amount" value="50.000" readonly>
                                           </div>
                                           <div class="mb-3">
                                            <label for="provider"
                                            class="form-label">Operateur</label>
                                            <select class="form-select" id="provider" required>
                                                <option value="">Choisissez un Operateur</option>
                                                <option value="mtn">MTN Mobile Money</option>
                                                <option value="orange">OrangeMoney</option>
                                            </select>
                                         </div>
                                         <div class=" d-grid text-center py-3">
                                         <button type="submit" class="btn btn-success">Payer maintenant</button>
                                        </div>
                                    </div>
                                    </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><a href="register.html">Need an account? Sign up!</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
